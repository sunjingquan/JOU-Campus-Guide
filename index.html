          </button>
          <button type="button" class="campus-option-card" data-select-campus="tongguan">
            <img src="/uploads/images/%E9%80%9A%E7%81%8C%E6%A0%A1%E5%8C%BA.jpg" alt="通灌校区实景" loading="lazy" />
            <div class="campus-option-body">
              <strong>通灌校区</strong>
              <span>海州区通灌南路 · 商院/艺设等</span>
            </div>
          </button>
          <button type="button" class="campus-option-card" data-select-campus="songtiao">
            <img src="/uploads/images/%E5%AE%8B%E8%B7%B3%E6%A0%A1%E5%8C%BA.jpg" alt="宋跳校区实景" loading="lazy" />
            <div class="campus-option-body">
              <strong>宋跳校区</strong>
              <span>高新区苍梧东路 · 应用技术学院</span>
            </div>
          </button>
        </div>
      </div>
    </dialog>

    <!-- 免登录勘误与反馈弹窗 -->
    <dialog class="modal-dialog" id="feedback-dialog" aria-labelledby="feedback-dialog-title">
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <span class="modal-kicker">Feedback &amp; Errata</span>
            <h2 id="feedback-dialog-title">指南勘误与建议</h2>
          </div>
          <button type="button" class="icon-btn" data-close-dialog="feedback-dialog" aria-label="关闭反馈窗口">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <form id="feedback-form" class="feedback-form">
          <p class="feedback-context" id="feedback-page-context">关联章节：指南总览</p>
          <label class="field-label" for="feedback-content">
            <span>发现的信息变动或补充建议 <em>*</em></span>
            <textarea
              id="feedback-content"
              name="content"
              rows="4"
              required
              maxlength="1800"
              placeholder="例如：苍梧二食堂二楼新增窗口、某宿舍楼门禁方式变动、希望补充的内容..."
            ></textarea>
          </label>
          <label class="field-label" for="feedback-contact">
            <span>联系方式（选填，方便核实致谢）</span>
            <input
              type="text"
              id="feedback-contact"
              name="contact"
              maxlength="120"
              placeholder="QQ / 邮箱 / 社区昵称"
            />
          </label>
          <div class="feedback-actions">
            <a
              class="ghost-link"
              href="https://bbs.jianghaidai.com/"
              target="_blank"
              rel="noopener"
            >
              需要互动答疑？去社区发帖 <svg><use href="#i-external" /></svg>
            </a>
            <button type="submit" class="btn btn-primary" id="feedback-submit-btn">提交反馈</button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- 全屏图片灯箱 -->
    <dialog class="modal-dialog lightbox-dialog" id="lightbox-dialog" aria-label="实景大图预览">
      <div class="lightbox-stage">
        <button type="button" class="lightbox-close icon-btn" data-close-dialog="lightbox-dialog" aria-label="关闭大图">
          <svg><use href="#i-close" /></svg>
        </button>
        <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一张">
          <svg><use href="#i-chevron-left" /></svg>
        </button>
        <figure class="lightbox-figure">
          <img id="lightbox-img" src="" alt="" />
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
        <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一张">
          <svg><use href="#i-chevron-right" /></svg>
        </button>
      </div>
    </dialog>

    <!-- 全局轻量提示条 -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <svg><use href="#i-check" /></svg>
      <span id="toast-text"></span>
    </div>

    <script type="module" src="/js/app.js?v=20261121"></script>
  </body>
</html>
